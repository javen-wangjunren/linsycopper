<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-width Pure Certificate Slider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --swiper-navigation-size: 18px; }

        .pureCertSwiper { padding-bottom: 56px; }

        .pureCertSwiper .swiper-button-next,
        .pureCertSwiper .swiper-button-prev {
            color: #0B3570;
            background: rgba(255, 255, 255, 0.96);
            width: 48px;
            height: 48px;
            border-radius: 2px;
            border: 2px solid rgba(11, 53, 112, 0.18);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        .pureCertSwiper .swiper-button-next:hover,
        .pureCertSwiper .swiper-button-prev:hover {
            color: #FFFFFF;
            background: #F97C30;
            border-color: #F97C30;
        }

        .pureCertSwiper .swiper-pagination-bullet {
            opacity: 1;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: rgba(11, 53, 112, 0.18);
            transition: all 300ms ease;
        }

        .pureCertSwiper .swiper-pagination-bullet-active {
            width: 28px;
            background: #F97C30;
        }
    </style>
</head>
<body class="bg-white font-sans">

    <section class="w-full overflow-hidden pt-[100px] pb-[100px]">
        
        <div class="mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-8 mb-12">
            <div class="border-l-4 border-[#F97C30] pl-6">
                <h2 class="text-heading text-3xl md:text-4xl font-bold text-[#0B3570]">Quality Certifications</h2>
                <p class="mt-3 max-w-2xl text-base leading-relaxed text-[#0B3570]/70">Verified international standards for copper manufacturing and supply.</p>
            </div>
        </div>

        <div class="w-full px-4 sm:px-6 lg:px-12 xl:px-16 2xl:px-20">
            <div class="swiper pureCertSwiper w-full overflow-visible">
                <div class="swiper-wrapper">
                    
                    <div class="swiper-slide">
                        <div class="aspect-[3/4] rounded-sm bg-white border border-black/10 shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:border-[#F97C30]">
                            <a href="https://via.placeholder.com/800x1067/FFFFFF/0B3570?text=ISO+9001" target="_blank" rel="noopener noreferrer" class="flex w-full h-full p-0 items-center justify-center">
                                <img src="https://via.placeholder.com/800x1067/FFFFFF/0B3570?text=ISO+9001" class="w-full h-full object-contain" alt="ISO 9001 Certification">
                            </a>
                        </div>
                    </div>

                    <div class="swiper-slide">
                        <div class="aspect-[3/4] rounded-sm bg-white border border-black/10 shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:border-[#F97C30]">
                            <a href="https://via.placeholder.com/800x1067/FFFFFF/0B3570?text=CE+MARK" target="_blank" rel="noopener noreferrer" class="flex w-full h-full p-0 items-center justify-center">
                                <img src="https://via.placeholder.com/800x1067/FFFFFF/0B3570?text=CE+MARK" class="w-full h-full object-contain" alt="CE Mark Compliance">
                            </a>
                        </div>
                    </div>

                    <div class="swiper-slide">
                        <div class="aspect-[3/4] rounded-sm bg-white border border-black/10 shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:border-[#F97C30]">
                            <a href="https://via.placeholder.com/800x1067/FFFFFF/0B3570?text=SGS+REPORT" target="_blank" rel="noopener noreferrer" class="flex w-full h-full p-0 items-center justify-center">
                                <img src="https://via.placeholder.com/800x1067/FFFFFF/0B3570?text=SGS+REPORT" class="w-full h-full object-contain" alt="SGS Report">
                            </a>
                        </div>
                    </div>

                    <div class="swiper-slide">
                        <div class="aspect-[3/4] rounded-sm bg-white border border-black/10 shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:border-[#F97C30]">
                            <a href="https://via.placeholder.com/800x1067/FFFFFF/0B3570?text=RoHS" target="_blank" rel="noopener noreferrer" class="flex w-full h-full p-0 items-center justify-center">
                                <img src="https://via.placeholder.com/800x1067/FFFFFF/0B3570?text=RoHS" class="w-full h-full object-contain" alt="RoHS Compliance">
                            </a>
                        </div>
                    </div>

                </div>
                
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.pureCertSwiper', {
            slidesPerView: 1,
            spaceBetween: 20,
            loop: true,
            autoplay: { delay: 5000 },
            pagination: { el: '.swiper-pagination', clickable: true },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            watchOverflow: true,
            grabCursor: true,
            breakpoints: {
                640: { slidesPerView: 2, spaceBetween: 24 },
                1024: { slidesPerView: 3, spaceBetween: 28 },
                1536: { slidesPerView: 4, spaceBetween: 32 }
            }
        });
    </script>
</body>
</html>
