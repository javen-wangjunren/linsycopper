<section class="relative bg-navy overflow-hidden">
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&q=80&w=1600" 
             class="w-full h-full object-cover opacity-30 grayscale" alt="Industrial Background">
        <div class="absolute inset-0 bg-gradient-to-r from-navy via-navy/80 to-transparent"></div>
    </div>

    <div class="max-w-[1280px] mx-auto px-6 py-20 relative z-10 flex flex-col lg:flex-row items-center gap-16">
        
        <div class="lg:w-5/12 text-white">
            <h3 class="text-xs font-mono font-bold text-gold uppercase tracking-[0.3em] mb-6">// Expert Consultation</h3>
            <h2 class="text-4xl md:text-5xl font-bold mb-6 uppercase tracking-tight leading-none">
                Consult <span class="text-gold">Our Experts</span>
            </h2>
            <p class="text-blue-100/80 text-lg mb-8 leading-relaxed">
                Give us a call at <a href="tel:3462305191" class="text-white font-bold hover:text-action transition underline">346.230.5191</a> or leave us a message below. Our material engineers are ready to assist with your specific project requirements.
            </p>
            
            <div class="grid grid-cols-2 gap-8 pt-8 border-t border-white/10">
                <div>
                    <div class="text-xl font-mono font-bold text-gold">1,000+ TONS</div>
                    <div class="text-[9px] uppercase tracking-widest opacity-60 font-bold">Ready Stock</div>
                </div>
                <div>
                    <div class="text-xl font-mono font-bold text-gold">ISO 9001</div>
                    <div class="text-[9px] uppercase tracking-widest opacity-60 font-bold">Certified Quality</div>
                </div>
            </div>
        </div>

        <div class="lg:w-7/12 w-full bg-white p-8 md:p-10 shadow-2xl rounded-sm border-t-4 border-action">
            <form id="quickContact" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Full Name *</label>
                        <input type="text" placeholder="e.g. John Doe" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Company Name</label>
                        <input type="text" placeholder="e.g. Linsy Manufacturing" class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Phone Number *</label>
                        <input type="tel" placeholder="+1 (000) 000-0000" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Email Address *</label>
                        <input type="email" placeholder="john@company.com" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="md:col-span-2 space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Address *</label>
                        <input type="text" placeholder="Street Address" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">City *</label>
                        <input type="text" placeholder="City" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">State *</label>
                        <input type="text" placeholder="State" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Zip Code *</label>
                        <input type="text" placeholder="Zip" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Country *</label>
                        <input type="text" placeholder="Country" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all">
                    </div>
                    <div class="md:col-span-2 space-y-1">
                        <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Attach Blueprint/Specs</label>
                        <div class="relative group">
                            <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            <div class="flex items-center justify-between bg-industrial p-3 border-2 border-dashed border-gray-300 group-hover:border-navy transition-colors">
                                <span class="text-xs text-gray-400">Upload Files (Max 20MB)</span>
                                <svg class="w-4 h-4 text-navy" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-navy uppercase tracking-widest">Message *</label>
                    <textarea rows="4" placeholder="Tell us about your requirements (Alloy Grade, Dimensions, Quantity...)" required class="w-full bg-industrial border-b-2 border-transparent focus:border-navy p-3 text-sm outline-none transition-all"></textarea>
                </div>

                <div class="flex items-center gap-6">
                    <button type="submit" class="bg-navy hover:bg-action text-white px-12 py-4 font-bold uppercase tracking-[0.2em] text-xs transition-all shadow-xl hover:-translate-y-1 transform">
                        Submit Inquiry
                    </button>
                    <span class="text-[9px] text-gray-400 font-mono italic">Secure 256-bit SSL Encryption</span>
                </div>
            </form>
        </div>
    </div>
</section>
